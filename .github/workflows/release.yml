name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-full:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      INCLUDE_SCREENAI: "1"

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependency
        run: python -m pip install --upgrade huggingface_hub

      - name: Validate pinned model sources
        run: python scripts/download_offline_models.py --validate-config

      - name: Verify Vietnamese first-run default
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath settings.ini.example -Raw
          if ($config -notmatch '(?m)^language\s*=\s*vi\s*$') {
            throw 'settings.ini.example must default to Vietnamese for release builds.'
          }
          $freshSettings = Join-Path $env:RUNNER_TEMP 'scanindex-fresh-settings.ini'
          python -c "import sys; from scanindex.infra.translations import read_startup_language; assert read_startup_language(sys.argv[1]) == 'vi'" $freshSettings
          if ($LASTEXITCODE -ne 0) {
            throw 'Fresh startup must use Vietnamese without a saved settings file.'
          }

      - name: Download and verify offline models
        run: python scripts/download_offline_models.py

      - name: Build full portable app
        shell: cmd
        run: build_portable.bat full

      - name: Package and test archive
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $folder = "dist\ScanIndex-$version"
          $archive = "dist\ScanIndex-$version.7z"
          $liveSettings = Get-ChildItem -LiteralPath $folder -File -Filter 'settings*.ini' |
            Where-Object { $_.Name -ne 'settings.ini.example' }
          if ($liveSettings) {
            throw "Portable build contains a live settings file that could override Vietnamese."
          }
          $screenAiDll = Get-ChildItem -LiteralPath "$folder\models\screen_ai" `
            -Recurse -File -Filter "chrome_screen_ai.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $screenAiDll) {
            throw "ScreenAI runtime is missing from the portable build."
          }
          7z a -t7z -mx=7 -mmt=on -bb0 -bsp0 $archive "$folder\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z t -bb0 -bsp0 $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          "Archive: $archive" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256: $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publish GitHub Release asset
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $archive = "dist\ScanIndex-$version.7z"
          # Release notes = annotated tag message (changelog); fall back to the generic line.
          git tag -l --format='%(contents)' $env:RELEASE_TAG *> release_notes.md
          if (-not ((Get-Content -LiteralPath release_notes.md -Raw).Trim())) {
            "Full portable Windows release with verified offline models." *> release_notes.md
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
              --title "ScanIndex $version" `
              --notes-file release_notes.md
          }
          gh release upload $env:RELEASE_TAG $archive --clobber `
            --repo $env:GITHUB_REPOSITORY
